spring.application.name=expense-tracker-history-service
server.port=8081

management.endpoints.web.exposure.include=health,info,metrics
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Expense tracker history service
info.app.version=0.0.1

spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/expense_history}

main-service.base-url=${MAIN_SERVICE_URL:http://localhost:8080}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=expense-history-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:app}
